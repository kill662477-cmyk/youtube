name: Update YouTube Feed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate youtube.json
        run: node scripts/update-youtube.js

      - name: Commit youtube.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update youtube feed"
          file_pattern: youtube.json
